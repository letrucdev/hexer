# Tests, cross-checks and an app build on every push to main and every pull request.
# The release workflow runs this first, so a release is only made from a passing build.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Distribution/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Distribution/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macOS 27 with Xcode 27.0 and the macOS 27 SDK, like the development Mac.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # bundle.sh numbers builds by commit count

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: Scripts/test.sh

      - name: Cross-checks against system tools
        run: Scripts/crosscheck.sh

      - name: App bundle
        run: Scripts/bundle.sh

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Hexer.app
          path: build/Hexer.app
          retention-days: 7
